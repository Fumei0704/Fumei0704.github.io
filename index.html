<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格展示網站</title>
    <style>
        /* 基礎重置與字型 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導覽列與簡約按鈕 */
        header {
            padding: 24px 0;
            display: flex;
            justify-content: center;
            background-color: transparent;
        }

        nav {
            display: flex;
            gap: 32px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: #888;
            cursor: pointer;
            padding: 8px 12px;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-btn:hover {
            color: #111;
        }

        .nav-btn.active {
            color: #111;
            font-weight: 600;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 2px;
            background-color: #111;
            border-radius: 1px;
        }

        /* 主要內容容器 */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-content.active {
            display: flex;
            opacity: 1;
        }

        /* 1. 圖片輪換頁面 */
        #gallery-page {
            position: relative;
            width: 100%;
            height: 75vh;
            align-items: center;
            justify-content: center;
        }

        .carousel-viewport {
            width: 80%;
            max-width: 900px;
            height: 100%;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background-color: #eee;
        }

        .carousel-slide {
            display: flex;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-item {
            min-width: 100%;
            height: 100%;
            position: relative;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 無邊框隱藏箭頭 (hover 時顯示) */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 2.5rem;
            color: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            padding: 20px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        /* 滑鼠懸停於頁面時顯示箭頭 */
        #gallery-page:hover .arrow-btn {
            opacity: 1;
        }

        .arrow-btn:hover {
            color: #000;
        }

        .arrow-prev { left: 4%; }
        .arrow-next { right: 4%; }

        /* 2. 文字頁面 */
        #text-page {
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .text-container {
            max-width: 640px;
            text-align: left;
            line-height: 1.8;
        }

        .text-container h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .text-container p {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 20px;
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .carousel-viewport {
                width: 92%;
            }
            .arrow-prev { left: 1%; }
            .arrow-next { right: 1%; }
            /* 行動裝置上無 hover，保持適度隱約可見 */
            #gallery-page:hover .arrow-btn { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列（無邊框按鈕） -->
    <header>
        <nav>
            <button class="nav-btn active" onclick="switchPage('gallery')">圖片展示</button>
            <button class="nav-btn" onclick="switchPage('text')">文字頁面</button>
        </nav>
    </header>

    <main>
        <!-- 圖片展示頁面 -->
        <section id="gallery-page" class="page-content active">
            <!-- 無邊框左右箭頭（預設隱藏，Hover 顯示） -->
            <button class="arrow-btn arrow-prev" onclick="moveSlide(-1)">&#10094;</button>

            <div class="carousel-viewport">
                <div class="carousel-slide" id="carouselSlide">
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1015/1200/800" alt="展示圖片 1">
                    </div>
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1018/1200/800" alt="展示圖片 2">
                    </div>
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1019/1200/800" alt="展示圖片 3">
                    </div>
                </div>
            </div>

            <button class="arrow-btn arrow-next" onclick="moveSlide(1)">&#10095;</button>
        </section>

        <!-- 文字頁面 -->
        <section id="text-page" class="page-content">
            <div class="text-container">
                <h1>極簡主義的思考</h1>
                <p>極簡設計不單純只是移除多餘的裝飾，而是將焦點重新放回最具價值的內容本身。透過留下適當的留白與細緻的互動，讓瀏覽者能更加專注於體驗本身。</p>
                <p>這是一個獨立的文字頁面，您可以在這裡寫下您的品牌故事、理念介紹或是個人日誌。</p>
            </div>
        </section>
    </main>

    <script>
        // 1. 頁面切換邏輯
        function switchPage(pageName) {
            const pages = document.querySelectorAll('.page-content');
            const buttons = document.querySelectorAll('.nav-btn');

            pages.forEach(page => page.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            if (pageName === 'gallery') {
                document.getElementById('gallery-page').classList.add('active');
                buttons[0].classList.add('active');
            } else if (pageName === 'text') {
                document.getElementById('text-page').classList.add('active');
                buttons[1].classList.add('active');
            }
        }

        // 2. 圖片輪換邏輯
        let currentIndex = 0;
        const totalSlides = 3;

        function moveSlide(direction) {
            const slide = document.getElementById('carouselSlide');
            currentIndex += direction;

            if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0;
            }

            slide.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
    </script>
</body>
</html>
