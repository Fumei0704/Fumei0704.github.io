<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格展示網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 柔和極簡漸層背景 */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部無邊框選單 */
        header {
            padding: 28px 0;
            display: flex;
            justify-content: center;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.05rem;
            color: #7f8c8d;
            cursor: pointer;
            padding: 8px 4px;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            color: #2c3e50;
        }

        .nav-btn.active {
            color: #2c3e50;
            font-weight: 600;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2c3e50;
            border-radius: 2px;
        }

        /* 主要內容區域 */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-content.active {
            display: flex;
            opacity: 1;
        }

        /* 1. 圖片輪換頁面（無邊框大圖設計） */
        #gallery-page {
            position: relative;
            width: 100%;
            height: 80vh;
            align-items: center;
            justify-content: center;
        }

        .carousel-viewport {
            width: 95%;
            max-width: 1400px;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .carousel-slide {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* 完整呈現圖片原貌不被強制裁切 */
            display: block;
        }

        /* 隱藏箭頭 (hover 時顯示) */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 3rem;
            color: rgba(44, 62, 80, 0.3);
            cursor: pointer;
            padding: 24px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        #gallery-page:hover .arrow-btn {
            opacity: 1;
        }

        .arrow-btn:hover {
            color: rgba(44, 62, 80, 0.9);
        }

        .arrow-prev { left: 2%; }
        .arrow-next { right: 2%; }

        /* 2. 文字頁面 */
        #text-page {
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .text-container {
            max-width: 680px;
            text-align: left;
            line-height: 1.9;
        }

        .text-container h1 {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 28px;
            letter-spacing: 1px;
            color: #2c3e50;
        }

        .text-container p {
            font-size: 1.05rem;
            color: #576574;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .arrow-prev { left: 0%; }
            .arrow-next { right: 0%; }
            #gallery-page:hover .arrow-btn { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <button class="nav-btn active" onclick="switchPage('gallery')">圖片展示</button>
            <button class="nav-btn" onclick="switchPage('text')">文字頁面</button>
        </nav>
    </header>

    <main>
        <!-- 圖片展示頁 -->
        <section id="gallery-page" class="page-content active">
            <button class="arrow-btn arrow-prev" onclick="moveSlide(-1)">&#10094;</button>

            <div class="carousel-viewport">
                <div class="carousel-slide" id="carouselSlide">
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1015/1400/900" alt="展示圖片 1">
                    </div>
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1018/1400/900" alt="展示圖片 2">
                    </div>
                    <div class="slide-item">
                        <img src="https://picsum.photos/id/1019/1400/900" alt="展示圖片 3">
                    </div>
                </div>
            </div>

            <button class="arrow-btn arrow-next" onclick="moveSlide(1)">&#10095;</button>
        </section>

        <!-- 文字頁 -->
        <section id="text-page" class="page-content">
            <div class="text-container">
                <h1>極簡主義的思考</h1>
                <p>極簡設計不單純只是移除多餘的裝飾，而是將焦點重新放回最具價值的內容本身。透過留下適當的留白與細緻的互動，讓瀏覽者能更加專注於體驗本身。</p>
                <p>這是一個獨立的文字頁面，您可以在這裡寫下您的品牌故事、理念介紹或是個人日誌。</p>
            </div>
        </section>
    </main>

    <script>
        function switchPage(pageName) {
            const pages = document.querySelectorAll('.page-content');
            const buttons = document.querySelectorAll('.nav-btn');

            pages.forEach(page => page.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            if (pageName === 'gallery') {
                document.getElementById('gallery-page').classList.add('active');
                buttons[0].classList.add('active');
            } else if (pageName === 'text') {
                document.getElementById('text-page').classList.add('active');
                buttons[1].classList.add('active');
            }
        }

        let currentIndex = 0;
        const totalSlides = 3;

        function moveSlide(direction) {
            const slide = document.getElementById('carouselSlide');
            currentIndex += direction;

            if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0;
            }

            slide.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
    </script>
</body>
</html>
