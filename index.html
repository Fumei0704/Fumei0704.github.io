<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片輪播範例 - GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>精選圖片輪播</h1>

        <!-- 輪播容器 -->
        <div class="carousel-container">
            <div class="carousel-slide">
                <!-- 圖片 1：可替換為 images/photo1.jpg 或網路圖片 URL -->
                <div class="slide">
                    <img src="https://picsum.photos/id/1018/1000/500" alt="風景 1">
                    <div class="caption">美麗的山林景色</div>
                </div>

                <!-- 圖片 2 -->
                <div class="slide">
                    <img src="https://picsum.photos/id/1015/1000/500" alt="風景 2">
                    <div class="caption">壯麗的河谷湖泊</div>
                </div>

                <!-- 圖片 3 -->
                <div class="slide">
                    <img src="https://picsum.photos/id/1019/1000/500" alt="風景 3">
                    <div class="caption">神秘的海邊奇岩</div>
                </div>
            </div>

            <!-- 左右控制按鈕 -->
            <button class="prev-btn">&#10094;</button>
            <button class="next-btn">&#10095;</button>

            <!-- 下方指示點 -->
            <div class="dots-container">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
