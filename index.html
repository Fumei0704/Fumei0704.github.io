<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格展示網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 單色低飽和度暖灰/奶茶背景 (極簡質感色) */
        body {
            background-color: #EFECE6;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部無邊框選單 */
        header {
            padding: 28px 0;
            display: flex;
            justify-content: center;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.05rem;
            color: #7f8c8d;
            cursor: pointer;
            padding: 8px 4px;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            color: #2c3e50;
        }

        .nav-btn.active {
            color: #2c3e50;
            font-weight: 600;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2c3e50;
            border-radius: 2px;
        }

        /* 主要內容區域 */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-content.active {
            display: flex;
            opacity: 1;
        }

        /* 圖片輪換頁面 */
        #gallery-page {
            position: relative;
            width: 100%;
            height: 80vh;
            align-items: center;
            justify-content: center;
        }

        .carousel-viewport {
            width: 95%;
            max-width: 1400px;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .carousel-slide {
            display: flex;
            height: 100%;
            /* 平滑移動動畫 */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 當需要直接跳頁（不上動畫）時套用此 Class */
        .carousel-slide.no-transition {
            transition: none !important;
        }

        .slide-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 隱藏箭頭 (hover 時顯示) */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 3rem;
            color: rgba(44, 62, 80, 0.3);
            cursor: pointer;
            padding: 24px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        #gallery-page:hover .arrow-btn {
            opacity: 1;
        }

        .arrow-btn:hover {
            color: rgba(44, 62, 80, 0.9);
        }

        .arrow-prev { left: 2%; }
        .arrow-next { right: 2%; }

        /* 文字頁面 */
        #text-page {
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .text-container {
            max-width: 680px;
            text-align: left;
            line-height: 1.9;
        }

        .text-container h1 {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 28px;
            letter-spacing: 1px;
            color: #2c3e50;
        }

        .text-container p {
            font-size: 1.05rem;
            color: #576574;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .arrow-prev { left: 0%; }
            .arrow-next { right: 0%; }
            #gallery-page:hover .arrow-btn { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <button class="nav-btn active" onclick="switchPage('gallery')">圖片展示</button>
            <button class="nav-btn" onclick="switchPage('text')">文字頁面</button>
        </nav>
    </header>

    <main>
        <!-- 圖片展示頁 -->
        <section id="gallery-page" class="page-content active">
            <button class="arrow-btn arrow-prev" onclick="moveSlide(-1)">&#10094;</button>

            <div class="carousel-viewport">
                <div class="carousel-slide" id="carouselSlide">
                    
                    <!-- 圖片 1 至 24 -->
                    <div class="slide-item"><img src="images/photo1.jpg" alt="圖片 1"></div>
                    <div class="slide-item"><img src="images/photo2.jpg" alt="圖片 2"></div>
                    <div class="slide-item"><img src="images/photo3.jpg" alt="圖片 3"></div>
                    <div class="slide-item"><img src="images/photo4.jpg" alt="圖片 4"></div>
                    <div class="slide-item"><img src="images/photo5.jpg" alt="圖片 5"></div>
                    <div class="slide-item"><img src="images/photo6.jpg" alt="圖片 6"></div>
                    <div class="slide-item"><img src="images/photo7.jpg" alt="圖片 7"></div>
                    <div class="slide-item"><img src="images/photo8.jpg" alt="圖片 8"></div>
                    <div class="slide-item"><img src="images/photo9.jpg" alt="圖片 9"></div>
                    <div class="slide-item"><img src="images/photo10.jpg" alt="圖片 10"></div>
                    <div class="slide-item"><img src="images/photo11.jpg" alt="圖片 11"></div>
                    <div class="slide-item"><img src="images/photo12.jpg" alt="圖片 12"></div>
                    <div class="slide-item"><img src="images/photo13.jpg" alt="圖片 13"></div>
                    <div class="slide-item"><img src="images/photo14.jpg" alt="圖片 14"></div>
                    <div class="slide-item"><img src="images/photo15.jpg" alt="圖片 15"></div>
                    <div class="slide-item"><img src="images/photo16.jpg" alt="圖片 16"></div>
                    <div class="slide-item"><img src="images/photo17.jpg" alt="圖片 17"></div>
                    <div class="slide-item"><img src="images/photo18.jpg" alt="圖片 18"></div>
                    <div class="slide-item"><img src="images/photo19.jpg" alt="圖片 19"></div>
                    <div class="slide-item"><img src="images/photo20.jpg" alt="圖片 20"></div>
                    <div class="slide-item"><img src="images/photo21.jpg" alt="圖片 21"></div>
                    <div class="slide-item"><img src="images/photo22.jpg" alt="圖片 22"></div>
                    <div class="slide-item"><img src="images/photo23.jpg" alt="圖片 23"></div>
                    <div class="slide-item"><img src="images/photo24.jpg" alt="圖片 24"></div>

                </div>
            </div>

            <button class="arrow-btn arrow-next" onclick="moveSlide(1)">&#10095;</button>
        </section>

        <!-- 文字頁 -->
        <section id="text-page" class="page-content">
            <div class="text-container">
                <h1>特別感謝</h1>
                <p>繪師</p>
                <p>共同委託名單</p>
                <p>文字頁面</p>
            </div>
        </section>
    </main>

    <script>
        function switchPage(pageName) {
            const pages = document.querySelectorAll('.page-content');
            const buttons = document.querySelectorAll('.nav-btn');

            pages.forEach(page => page.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            if (pageName === 'gallery') {
                document.getElementById('gallery-page').classList.add('active');
                buttons[0].classList.add('active');
            } else if (pageName === 'text') {
                document.getElementById('text-page').classList.add('active');
                buttons[1].classList.add('active');
            }
        }

        let currentIndex = 0;

        function moveSlide(direction) {
            const slideTrack = document.getElementById('carouselSlide');
            const slides = document.querySelectorAll('.slide-item');
            const totalSlides = slides.length;

            let nextIndex = currentIndex + direction;

            // 判斷是否需要「直接切換（無視過渡動畫）」
            const isLooping = (nextIndex < 0 || nextIndex >= totalSlides);

            if (isLooping) {
                // 1. 關閉滑動動畫
                slideTrack.classList.add('no-transition');

                // 2. 計算環狀目標位置
                if (nextIndex < 0) {
                    currentIndex = totalSlides - 1;
                } else if (nextIndex >= totalSlides) {
                    currentIndex = 0;
                }

                // 3. 瞬間移動到指定位置
                slideTrack.style.transform = `translateX(-${currentIndex * 100}%)`;

                // 4. 強制瀏覽器重繪後，把動畫開回來
                void slideTrack.offsetWidth;
                slideTrack.classList.remove('no-transition');
            } else {
                // 一般正常滑動
                currentIndex = nextIndex;
                slideTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
            }
        }
    </script>
</body>
</html>
