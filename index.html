<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格展示網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 預設背景顏色與平滑過渡動畫 */
        body {
            background-color: #EFECE6; /* 預設第一張圖片背景 */
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.6s ease; /* 換頁時背景顏色平滑漸變 */
        }

        /* 頂部無邊框選單 */
        header {
            padding: 28px 0;
            display: flex;
            justify-content: center;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.05rem;
            color: #7f8c8d;
            cursor: pointer;
            padding: 8px 4px;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            color: #2c3e50;
        }

        .nav-btn.active {
            color: #2c3e50;
            font-weight: 600;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2c3e50;
            border-radius: 2px;
        }

        /* 主要內容區域 */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-content.active {
            display: flex;
            opacity: 1;
        }

        /* 圖片輪換頁面 */
        #gallery-page {
            position: relative;
            width: 100%;
            height: 80vh;
            align-items: center;
            justify-content: center;
        }

        .carousel-viewport {
            width: 95%;
            max-width: 1400px;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .carousel-slide {
            display: flex;
            height: 100%;
            transition: transform 0.4s ease-out;
            will-change: transform;
        }

        /* 當無縫直接跳頁時暫停動畫 */
        .carousel-slide.no-transition {
            transition: none !important;
        }

        .slide-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 隱藏箭頭 (hover 時顯示) */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 3rem;
            color: rgba(44, 62, 80, 0.3);
            cursor: pointer;
            padding: 24px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        #gallery-page:hover .arrow-btn {
            opacity: 1;
        }

        .arrow-btn:hover {
            color: rgba(44, 62, 80, 0.9);
        }

        .arrow-prev {
            left: 2%;
        }

        .arrow-next {
            right: 2%;
        }

        /* 文字頁面 */
        #text-page {
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .text-container {
            max-width: 680px;
            text-align: left;
            line-height: 1.9;
        }

        .text-container h1 {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 28px;
            letter-spacing: 1px;
            color: #2c3e50;
        }

        .text-container p {
            font-size: 1.05rem;
            color: #576574;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .arrow-prev {
                left: 0%;
            }

            .arrow-next {
                right: 0%;
            }

            #gallery-page:hover .arrow-btn {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <button class="nav-btn active" onclick="switchPage('gallery')">
                圖片展示
            </button>

            <button class="nav-btn" onclick="switchPage('text')">
                文字頁面
            </button>
        </nav>
    </header>

    <main>

        <!-- 圖片展示頁 -->
        <section id="gallery-page" class="page-content active">

            <button class="arrow-btn arrow-prev" onclick="moveSlide(-1)">
                &#10094;
            </button>

            <div class="carousel-viewport">

                <div class="carousel-slide" id="carouselSlide">

                    <!-- 圖片 1 至 24 -->

                    <div class="slide-item">
                        <img src="images/photo1.jpg" alt="圖片 1">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo2.jpg" alt="圖片 2">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo3.jpg" alt="圖片 3">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo4.jpg" alt="圖片 4">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo5.jpg" alt="圖片 5">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo6.jpg" alt="圖片 6">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo7.jpg" alt="圖片 7">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo8.jpg" alt="圖片 8">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo9.jpg" alt="圖片 9">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo10.jpg" alt="圖片 10">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo11.jpg" alt="圖片 11">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo12.jpg" alt="圖片 12">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo13.jpg" alt="圖片 13">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo14.jpg" alt="圖片 14">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo15.jpg" alt="圖片 15">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo16.jpg" alt="圖片 16">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo17.jpg" alt="圖片 17">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo18.jpg" alt="圖片 18">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo19.jpg" alt="圖片 19">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo20.jpg" alt="圖片 20">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo21.jpg" alt="圖片 21">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo22.jpg" alt="圖片 22">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo23.jpg" alt="圖片 23">
                    </div>

                    <div class="slide-item">
                        <img src="images/photo24.jpg" alt="圖片 24">
                    </div>

                </div>

            </div>

            <button class="arrow-btn arrow-next" onclick="moveSlide(1)">
                &#10095;
            </button>

        </section>

        <!-- 文字頁 -->
        <section id="text-page" class="page-content">

            <div class="text-container">
                <h1>特別感謝</h1>
                <p>繪師</p>
                <p>委託名單</p>
            </div>

        </section>

    </main>

    <script>

        // 24 張圖片對應的低飽和度背景色列表
        const backgroundColors = [
            "#EFECE6",
            "#E6EBE0",
            "#EDF2F4",
            "#F4EAD4",
            "#F0E6EF",
            "#E2ECE9",
            "#EAE4E9",
            "#FFF1E6",
            "#FDE2E4",
            "#DBE7E4",
            "#E4C1F9",
            "#D6E2E9",
            "#E9ECEF",
            "#F3E9DC",
            "#D8E2DC",
            "#FFE5D9",
            "#ECE4DB",
            "#E0E1DD",
            "#F1FAEE",
            "#E8D8CE",
            "#DFE7FD",
            "#F0F3F4",
            "#EAD7D7",
            "#DCE1E3"
        ];


        function switchPage(pageName) {

            const pages =
                document.querySelectorAll('.page-content');

            const buttons =
                document.querySelectorAll('.nav-btn');


            pages.forEach(page =>
                page.classList.remove('active')
            );

            buttons.forEach(btn =>
                btn.classList.remove('active')
            );


            if (pageName === 'gallery') {

                document
                    .getElementById('gallery-page')
                    .classList.add('active');

                buttons[0].classList.add('active');

            }

            else if (pageName === 'text') {

                document
                    .getElementById('text-page')
                    .classList.add('active');

                buttons[1].classList.add('active');
            }
        }


        /* =========================
           輪播初始化
        ========================= */

        const slideTrack =
            document.getElementById('carouselSlide');

        const originalSlides =
            Array.from(
                document.querySelectorAll('.slide-item')
            );

        const totalSlides =
            originalSlides.length;


        const firstClone =
            originalSlides[0].cloneNode(true);

        const lastClone =
            originalSlides[
                totalSlides - 1
            ].cloneNode(true);


        slideTrack.appendChild(firstClone);

        slideTrack.insertBefore(
            lastClone,
            slideTrack.firstChild
        );



        let currentIndex = 1;

        let isAnimating = false;


        /* 初始化到真正的第一張 */

        slideTrack.classList.add(
            'no-transition'
        );

        slideTrack.style.transform =
            `translateX(-${currentIndex * 100}%)`;


        void slideTrack.offsetWidth;


        slideTrack.classList.remove(
            'no-transition'
        );


        /* =========================
           取得真正圖片編號
        ========================= */

        function getRealIndex() {

            /*
                假 24
            */

            if (currentIndex === 0) {
                return totalSlides - 1;
            }


            /*
                假 1
            */

            if (
                currentIndex ===
                totalSlides + 1
            ) {
                return 0;
            }


            return currentIndex - 1;
        }


        /* =========================
           更新背景色
        ========================= */

        function updateBackgroundColor() {

            document.body.style.backgroundColor =
                backgroundColors[
                    getRealIndex()
                ];
        }


        /* =========================
           移動圖片
        ========================= */

        function moveSlide(direction) {

            /*
                動畫還沒結束時
                不接受下一次操作
                防止 index 跑掉
            */

            if (isAnimating) {
                return;
            }


            isAnimating = true;

            currentIndex += direction;


            slideTrack.style.transform =
                `translateX(-${currentIndex * 100}%)`;


            updateBackgroundColor();
        }


        /* =========================
           無縫循環
        ========================= */

        slideTrack.addEventListener(
            'transitionend',
            (event) => {

                /*
                    只監聽 transform 動畫
                */

                if (
                    event.propertyName !==
                    'transform'
                ) {
                    return;
                }


                /*
                    24 → 假 1

                    動畫結束後
                    瞬間跳到真正的 1
                */

                if (
                    currentIndex ===
                    totalSlides + 1
                ) {

                    slideTrack.classList.add(
                        'no-transition'
                    );


                    currentIndex = 1;


                    slideTrack.style.transform =
                        `translateX(-${currentIndex * 100}%)`;


                    void slideTrack.offsetWidth;


                    slideTrack.classList.remove(
                        'no-transition'
                    );
                }


                /*
                    1 → 假 24

                    動畫結束後
                    瞬間跳到真正的 24
                */

                else if (
                    currentIndex === 0
                ) {

                    slideTrack.classList.add(
                        'no-transition'
                    );


                    currentIndex =
                        totalSlides;


                    slideTrack.style.transform =
                        `translateX(-${currentIndex * 100}%)`;


                    void slideTrack.offsetWidth;


                    slideTrack.classList.remove(
                        'no-transition'
                    );
                }


                updateBackgroundColor();


                /*
                    動畫結束
                    重新允許操作
                */

                isAnimating = false;
            }
        );


        /* =========================
           手機左右滑動
        ========================= */

        const carouselViewport =
            document.querySelector(
                '.carousel-viewport'
            );


        let touchStartX = 0;
        let touchStartY = 0;


        carouselViewport.addEventListener(
            'touchstart',
            (event) => {

                touchStartX =
                    event.changedTouches[0].clientX;

                touchStartY =
                    event.changedTouches[0].clientY;

            },
            {
                passive: true
            }
        );


        carouselViewport.addEventListener(
            'touchend',
            (event) => {

                const touchEndX =
                    event.changedTouches[0].clientX;

                const touchEndY =
                    event.changedTouches[0].clientY;


                const deltaX =
                    touchEndX - touchStartX;

                const deltaY =
                    touchEndY - touchStartY;


                /*
                    至少滑動 50px
                    才判定為有效手勢
                */

                const swipeThreshold = 50;


                /*
                    水平距離必須大於：
                    1. 50px
                    2. 垂直距離

                    避免上下滑頁面時
                    誤切圖片
                */

                if (
                    Math.abs(deltaX) >
                        swipeThreshold
                    &&
                    Math.abs(deltaX) >
                        Math.abs(deltaY)
                ) {

                    /*
                        往左滑
                        → 下一張
                    */

                    if (deltaX < 0) {

                        moveSlide(1);

                    }

                    /*
                        往右滑
                        → 上一張
                    */

                    else {

                        moveSlide(-1);

                    }
                }

            },
            {
                passive: true
            }
        );


        /* 初始化背景色 */

        updateBackgroundColor();

    </script>

</body>
</html>
